<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LBJ 接收记录浏览器</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color: #203035; background: #f4f7f6; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    body.map-expanded { overflow: hidden; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .page { max-width: 1500px; margin: auto; padding: 28px 28px 56px; }
    .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .eyebrow { color: #417f75; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 6px 0 7px; font-size: clamp(25px, 3vw, 36px); letter-spacing: -.03em; }
    .intro { margin: 0; color: #66777a; font-size: 14px; }
    .button { border: 1px solid #cbd9d6; background: white; color: #29453f; border-radius: 10px; padding: 10px 15px; font-weight: 650; white-space: nowrap; }
    .button:hover { border-color: #418c7e; background: #f4fbf8; }
    .button.primary { border-color: #176955; background: #176955; color: white; }
    .button.primary:hover { background: #0f5544; }
    .button:disabled { opacity: .5; cursor: not-allowed; }
    .actions { display: flex; gap: 9px; flex-wrap: wrap; }
    .panel { background: white; border: 1px solid #dce5e2; border-radius: 16px; box-shadow: 0 8px 30px #1a3a3108; }
    .upload { padding: 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-style: dashed; border-color: #a8c8bd; background: #f8fcfa; }
    .upload.dragging { border-color: #176955; background: #eaf6f0; }
    .upload strong { display: block; margin-bottom: 5px; }
    .upload span { color: #70807e; font-size: 13px; }
    #fileInput { display: none; }
    .notice { min-height: 21px; margin: 11px 2px 15px; color: #61736f; font-size: 13px; }
    .notice.error { color: #a33535; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat { padding: 17px 19px; }
    .stat .label { color: #71817e; font-size: 12px; }
    .stat .value { display: block; margin-top: 5px; font-size: 24px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .stat .value.small { font-size: 16px; padding-top: 5px; }
    .filters { padding: 18px; margin-bottom: 16px; }
    .filter-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    h2 { margin: 0; font-size: 16px; }
    .link { border: 0; background: none; color: #176955; padding: 5px; font-size: 13px; }
    .filter-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 11px; }
    .filter-grid .search-field { grid-column: span 2; }
    .filter-grid .train-field { grid-column: span 2; }
    .field label { display: block; margin-bottom: 5px; color: #687a76; font-size: 12px; }
    .field input, .field select { width: 100%; height: 40px; border: 1px solid #cfdbd6; border-radius: 9px; background: white; padding: 0 11px; outline-color: #3d967c; color: #243633; }
    .checks { display: flex; flex-wrap: wrap; gap: 9px 20px; margin-top: 15px; font-size: 13px; }
    .checks label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .checks input { accent-color: #176955; }
    .results { overflow: hidden; width: 100%; }
    .results.map-expanded { overflow: visible; }
    .results-head { padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #e4eae7; }
    .results-head p { margin: 4px 0 0; font-size: 12px; color: #758581; }
    .view-switch { display: flex; gap: 4px; padding: 3px; border: 1px solid #d5e1db; border-radius: 10px; background: #f4f8f5; }
    .view-switch button { border: 0; border-radius: 7px; padding: 7px 14px; color: #557169; background: transparent; font-weight: 650; }
    .view-switch button.active { color: white; background: #176955; }
    .table-wrap { overflow: auto; max-height: 67vh; }
    table { width: 100%; min-width: 1100px; table-layout: fixed; border-collapse: collapse; font-size: 13px; }
    thead { position: sticky; top: 0; background: #edf5f0; z-index: 1; }
    th { color: #3b6354; font-size: 12px; font-weight: 700; letter-spacing: .03em; text-align: left; white-space: nowrap; padding: 13px 12px; border-right: 1px solid #dbe9e0; border-bottom: 2px solid #c6ddd0; }
    th:last-child { border-right: 0; }
    td { padding: 10px 12px; border-bottom: 1px solid #edf1ef; vertical-align: middle; }
    th:last-child, td:last-child { text-align: center; }
    tbody tr:hover { background: #eff8f3; }
    .raw { white-space: pre; font-variant-numeric: tabular-nums; }
    .date { color: #6d7e7a; font-size: 11px; }
    .time { font-size: 17px; line-height: 1.35; font-weight: 750; font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #eaf4ee; color: #28694d; font-size: 12px; white-space: pre; }
    .pill.warn { background: #fff1e4; color: #955d20; }
    .empty { text-align: center; padding: 64px 20px; color: #74837e; }
    .empty strong { display: block; color: #344b42; margin-bottom: 6px; }
    .more { border: 0; background: transparent; color: #176955; font-weight: 650; white-space: nowrap; padding: 5px 0; }
    .more:hover { text-decoration: underline; }
    .more:focus-visible { outline: 2px solid #176955; outline-offset: 3px; border-radius: 3px; }
    .map-pane { padding: 16px 18px 20px; }
    .map-summary { margin: 0 0 12px; font-size: 13px; color: #61736e; }
    .map-toolbar { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 14px; margin-bottom: 12px; }
    .map-toolbar-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .map-toolbar .button { padding: 7px 11px; font-size: 12px; }
    .map-toolbar .button.active { border-color: #176955; background: #eaf5ef; color: #145b49; }
    .map-toolbar .expand-map { margin-left: auto; }
    .map-pane.expanded .map-toolbar .expand-map { border-color: #176955; background: #176955; color: white; }
    .map-pane.expanded .map-toolbar .expand-map:hover { background: #0f5544; }
    .map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 14px; align-items: stretch; }
    .map-pane.expanded { position: fixed; inset: 12px; z-index: 50; display: flex; flex-direction: column; min-height: 0; padding: 18px; border: 1px solid #cadcd2; border-radius: 16px; background: white; box-shadow: 0 22px 70px #17392c40; }
    .map-pane.expanded .map-layout { flex: 1; min-height: 0; }
    .map-pane.expanded .online-map, .map-pane.expanded .coordinate-map { height: 100%; min-height: 0; }
    .map-pane.expanded .map-side { overflow: auto; }
    .coordinate-map { display: block; width: 100%; height: min(59vh, 570px); min-height: 380px; border: 1px solid #dce6e1; border-radius: 11px; background: #edf5f0; }
    .online-map { width: 100%; height: min(59vh, 570px); min-height: 380px; border: 1px solid #dce6e1; border-radius: 11px; background: #edf5f0; }
    .online-map-status { align-self: center; padding: 30px; text-align: center; color: #61736e; }
    .map-side { display: grid; grid-template-columns: 1fr; align-content: start; gap: 13px; border: 1px solid #e2ebe5; border-radius: 11px; padding: 18px 20px; background: #f9fbf9; font-size: 13px; }
    .map-side h3 { margin: 0 0 3px; font-size: 16px; }
    .map-side p { margin: 0; color: #70807b; }
    .map-side .item { min-width: 0; }
    .map-side .button { justify-self: start; }
    .map-side .label { display: block; margin-bottom: 3px; color: #71827c; font-size: 12px; }
    .map-side .value { overflow-wrap: anywhere; font-size: 15px; font-weight: 600; }
    .map-note { color: #70807b; font-size: 12px; line-height: 1.6; margin: 13px 0 0; }
    .map-grid-line { stroke: #cfddd4; stroke-width: 1; }
    .map-axis { fill: #60786d; font: 13px system-ui, sans-serif; }
    .map-point { fill: #16725e; fill-opacity: .67; stroke: #fff; stroke-width: 1; cursor: pointer; }
    .map-point:hover, .map-point.selected { fill: #e56e3b; fill-opacity: 1; stroke: #843816; stroke-width: 2; }
    .map-no-data { fill: #667a71; font: 20px system-ui, sans-serif; text-anchor: middle; }
    dialog { width: min(790px, calc(100vw - 24px)); max-height: min(88vh, 900px); padding: 0; border: 1px solid #d8e5de; border-radius: 16px; box-shadow: 0 25px 85px #11282044; }
    dialog::backdrop { background: #12291f88; }
    .dialog-head { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 17px 22px; border-bottom: 1px solid #e2e9e5; background: white; z-index: 1; }
    .dialog-head h2 { font-size: 18px; }
    .close { border: 0; border-radius: 8px; background: #eef4f0; font-size: 21px; width: 34px; height: 34px; }
    .dialog-body { padding: 18px 22px 24px; overflow: auto; max-height: calc(min(88vh, 900px) - 70px); }
    .detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px 18px; margin-bottom: 22px; }
    .detail-item .name { color: #74837e; font-size: 12px; margin-bottom: 4px; }
    .detail-item .value { min-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
    .raw-block { border-top: 1px solid #e4ebe6; padding-top: 16px; margin-top: 15px; }
    .raw-block h3 { font-size: 13px; margin: 0 0 8px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; padding: 13px; background: #f4f7f5; border-radius: 9px; font-size: 12px; line-height: 1.6; }
    @media (max-width: 980px) { .map-toolbar, .map-layout { grid-template-columns: 1fr; } .map-toolbar-spacer { display: none; } .map-side { grid-template-columns: repeat(2, minmax(0, 1fr)); } .map-side h3, .map-side p { grid-column: 1 / -1; } .map-pane.expanded .map-layout { grid-template-rows: minmax(0, 1fr) auto; } .map-pane.expanded .map-side { max-height: 30vh; overflow: auto; } }
    @media (max-width: 900px) { .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .filter-grid .search-field, .filter-grid .train-field { grid-column: 1 / -1; } }
    @media (max-width: 620px) { .page { padding: 20px 12px 40px; } .top, .upload { flex-direction: column; align-items: stretch; } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .filter-grid { grid-template-columns: 1fr; } .filter-grid .search-field, .filter-grid .train-field { grid-column: auto; } .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .results-head { align-items: flex-start; flex-direction: column; } .map-side { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div>
        <div class="eyebrow">LBJ / CSV Viewer</div>
        <h1>接收记录浏览器</h1>
        <p class="intro">导入设备生成的 CSV，按行查看、搜索和筛选。</p>
      </div>
      <div class="actions"><button class="button" id="exportButton" disabled>导出筛选结果</button></div>
    </header>

    <section class="panel upload" id="dropZone" aria-label="导入 CSV 文件">
      <div><strong id="fileName">选择 CSV 文件</strong><span>也可将文件拖到这里。</span></div>
      <button class="button primary" id="chooseButton">选择文件</button>
      <input id="fileInput" type="file" accept=".csv,text/csv">
    </section>
    <div class="notice" id="notice" role="status">尚未导入文件。</div>

    <section class="stats" aria-label="记录概览">
      <div class="panel stat"><span class="label">总记录</span><span class="value" id="totalCount">—</span></div>
      <div class="panel stat"><span class="label">当前结果</span><span class="value" id="resultCount">—</span></div>
      <div class="panel stat"><span class="label">错误率不为 0</span><span class="value" id="errorCount">—</span></div>
      <div class="panel stat"><span class="label">时间范围</span><span class="value small" id="dateRange">—</span></div>
    </section>

    <section class="panel filters" aria-label="筛选记录">
      <div class="filter-head"><h2>筛选记录</h2><button class="link" id="resetButton">清除筛选</button></div>
      <div class="filter-grid">
        <div class="field search-field"><label for="search">搜索所有字段</label><input id="search" type="search" placeholder="车次、机车编号、线路、原始数据…"></div>
        <div class="field"><label for="dateFilter">日期</label><select id="dateFilter"><option value="">全部日期</option></select></div>
        <div class="field"><label for="routeFilter">线路</label><select id="routeFilter"><option value="">全部线路</option></select></div>
        <div class="field"><label for="directionFilter">方向</label><select id="directionFilter"><option value="">全部方向</option></select></div>
        <div class="field"><label for="sortOrder">排序</label><select id="sortOrder"><option value="newest">接收时间：最新优先</option><option value="oldest">接收时间：最早优先</option><option value="file">CSV 原始顺序</option></select></div>
        <div class="field train-field"><label for="trainFilter">车次包含</label><input id="trainFilter" type="search" placeholder="输入车次 例如 K1234"></div>
        <div class="field"><label for="locoFilter">机车编号包含</label><input id="locoFilter" type="search" placeholder="请输入机车编号"></div>
        <div class="field"><label for="minSpeed">最低速度</label><input id="minSpeed" type="number" step="any" placeholder="请输入数字"></div>
        <div class="field"><label for="minRssi">最低 RSSI</label><input id="minRssi" type="number" step="any" placeholder="例如 -90"></div>
        <div class="field"><label for="maxError">最高错误率 (%)</label><input id="maxError" type="number" min="0" step="any" placeholder="例如 1"></div>
      </div>
      <div class="checks">
        <label><input id="trainOnly" type="checkbox">只看有车次的记录</label>
        <label><input id="coordsOnly" type="checkbox">只看有有效坐标的记录</label>
        <label><input id="noErrorsOnly" type="checkbox">只看错误率为 0 的记录</label>
      </div>
    </section>

    <section class="panel results" id="resultsPanel">
      <div class="results-head">
        <div><h2 id="resultsTitle">记录列表</h2><p id="resultsHint">点击“查看详情”查看全部字段。</p></div>
        <div class="view-switch" aria-label="显示方式"><button type="button" id="listViewButton" class="active" aria-pressed="true">列表</button><button type="button" id="mapViewButton" aria-pressed="false">地图</button></div>
      </div>
      <div class="table-wrap" id="tableWrap">
        <table id="recordsTable" hidden>
          <colgroup><col style="width: 12%"><col style="width: 7%"><col style="width: 11%"><col style="width: 8%"><col style="width: 9%"><col style="width: 14%"><col style="width: 16%"><col style="width: 8%"><col style="width: 8%"><col style="width: 7%"></colgroup>
          <thead><tr><th>接收时间</th><th>方向</th><th>车次</th><th>速度</th><th>公里标</th><th>机车编号</th><th>线路</th><th>RSSI</th><th>错误率</th><th>操作</th></tr></thead><tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty"><strong>还没有记录</strong>选择 CSV 文件后，记录将会显示在这里。</div>
      </div>
      <div class="map-pane" id="mapPane" hidden>
        <p class="map-summary" id="mapSummary">导入 CSV 后显示当前筛选结果中的有效坐标。</p>
        <div class="map-toolbar"><div class="map-toolbar-main"><button class="button active" type="button" id="onlineMapButton">在线底图</button><button class="button" type="button" id="localMapButton">本地坐标图</button><button class="button expand-map" type="button" id="expandMapButton" aria-pressed="false">放大地图</button></div><div class="map-toolbar-spacer" aria-hidden="true"></div></div>
        <div class="map-layout">
          <div class="online-map" id="onlineMap" hidden></div>
          <svg class="coordinate-map" id="coordinateMap" viewBox="0 0 1000 600" role="img" aria-label="筛选结果的经纬度分布"></svg>
          <aside class="map-side" id="mapSide"><h3>位置详情</h3><p>点击图上的点查看对应记录。</p></aside>
        </div>
        <p class="map-note" id="mapNote">在线底图由 OpenFreeMap 提供，只绘制当前筛选结果中格式完整的坐标，点位仅供参考。</p>
      </div>
    </section>
  </main>

  <dialog id="detailDialog" aria-label="记录详情">
    <div class="dialog-head"><h2 id="detailTitle">记录详情</h2><button class="close" id="closeButton" aria-label="关闭">×</button></div>
    <div class="dialog-body" id="detailBody"></div>
  </dialog>

  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const requiredHeaders = ['日期', '时间', '车次', '机车编号', '原始数据', '错误率'];
    let headers = [];
    let records = [];
    let filtered = [];
    let loadedName = '';
    let currentView = 'list';
    let mapMode = 'online';
    let mapExpanded = false;
    let onlineMap = null;
    let onlineMapReady = false;
    let mapLibraryPromise = null;

    // Parse quoted commas, escaped quotes and line breaks inside quoted fields.
    function parseCSV(text) {
      const rows = [];
      let row = [], field = '', quoted = false, line = 1;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (quoted) {
          if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (ch === '"') quoted = false;
          else { field += ch; if (ch === '\n') line++; }
        } else if (ch === '"' && field === '') {
          quoted = true;
        } else if (ch === ',') {
          row.push(field); field = '';
        } else if (ch === '\r' || ch === '\n') {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          row.push(field); rows.push({ values: row, line });
          row = []; field = ''; line++;
        } else {
          field += ch;
        }
      }
      if (quoted) throw new Error(`第 ${line} 行存在未闭合的引号。`);
      if (field !== '' || row.length) { row.push(field); rows.push({ values: row, line }); }
      return rows;
    }

    function value(record, name) { return record.values[headers.indexOf(name)] ?? ''; }
    function usable(text) { return text.trim() !== '' && !/^(?:-+|<NUL>|NUL)$/i.test(text.trim()); }
    function validRoute(text) { return /^[\p{Script=Han}]{1,7}(?:线|台|西)$/u.test(text.trim()); }
    function degreeMinute(text, maxDegrees) {
      const match = /^(\d+)°(\d+(?:\.\d+)?)′$/.exec(text.trim());
      if (!match) return null;
      const minutes = Number(match[2]);
      const degrees = Number(match[1]) + minutes / 60;
      return minutes < 60 && degrees <= maxDegrees ? degrees : null;
    }
    function coordinates(record) {
      const lat = degreeMinute(value(record, '纬度'), 90);
      const lon = degreeMinute(value(record, '经度'), 180);
      return lat === null || lon === null ? null : [lon, lat];
    }
    function hasCoordinates(record) { return coordinates(record) !== null; }
    function hasNoErrors(record) { return Number.parseFloat(value(record, '错误率')) === 0; }
    function hasErrors(record) { return !hasNoErrors(record); }
    function displayTrain(record) {
      const level = value(record, '级别').trim();
      const train = value(record, '车次').trim();
      return level !== 'NA' && /^[A-Z]{1,2}$/.test(level) && /^\d+$/.test(train)
        ? level + train : train;
    }
    function textNode(tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) element.className = className;
      return element;
    }
    function setNotice(message, error = false) { $('notice').textContent = message; $('notice').classList.toggle('error', error); }

    function setOptions(select, values, label) {
      select.replaceChildren(new Option(label, ''));
      for (const item of [...new Set(values)].filter(Boolean).sort((a, b) => a.localeCompare(b, 'zh-CN')))
        select.add(new Option(item, item));
    }

    function refresh() {
      if (!records.length) {
        filtered = [];
        $('resultCount').textContent = '0';
        $('exportButton').disabled = true;
        renderRows();
        renderMap();
        return;
      }
      const query = $('search').value.trim().toLocaleLowerCase();
      const date = $('dateFilter').value, route = $('routeFilter').value, direction = $('directionFilter').value;
      const train = $('trainFilter').value.trim().toLocaleLowerCase();
      const loco = $('locoFilter').value.trim().toLocaleLowerCase();
      const minSpeed = $('minSpeed').value === '' ? null : Number($('minSpeed').value);
      const minRssi = $('minRssi').value === '' ? null : Number($('minRssi').value);
      const maxError = $('maxError').value === '' ? null : Number($('maxError').value);
      filtered = records.filter(record =>
        (!query || record.search.includes(query)) &&
        (!date || value(record, '日期') === date) &&
        (!route || value(record, '线路').trim() === route) &&
        (!direction || value(record, '方向').trim() === direction) &&
        (!train || displayTrain(record).toLocaleLowerCase().includes(train)) &&
        (!loco || value(record, '机车编号').toLocaleLowerCase().includes(loco)) &&
        (minSpeed === null || Number.parseFloat(value(record, '速度')) >= minSpeed) &&
        (minRssi === null || Number.parseFloat(value(record, 'RSSI')) >= minRssi) &&
        (maxError === null || Number.parseFloat(value(record, '错误率')) <= maxError) &&
        (!$('trainOnly').checked || usable(value(record, '车次'))) &&
        (!$('coordsOnly').checked || hasCoordinates(record)) &&
        (!$('noErrorsOnly').checked || hasNoErrors(record))
      );
      if ($('sortOrder').value !== 'file') {
        filtered.sort((a, b) => {
          const order = (value(a, '日期') + ' ' + value(a, '时间')).localeCompare(value(b, '日期') + ' ' + value(b, '时间'));
          return $('sortOrder').value === 'newest' ? -order || b.index - a.index : order || a.index - b.index;
        });
      }
      $('resultCount').textContent = filtered.length.toLocaleString('zh-CN');
      $('exportButton').disabled = !filtered.length;
      renderRows();
      renderMap();
    }

    function renderRows() {
      const tbody = $('rows');
      const fragment = document.createDocumentFragment();
      for (const record of filtered) {
        const tr = document.createElement('tr');
        const timeCell = document.createElement('td');
        timeCell.append(textNode('div', value(record, '日期'), 'date'), textNode('div', value(record, '时间'), 'time'));
        tr.append(timeCell);
        for (const name of ['方向', '车次', '速度', '公里标', '机车编号', '线路', 'RSSI']) {
          const td = document.createElement('td');
          td.append(textNode('span', name === '车次' ? displayTrain(record) : value(record, name), 'raw'));
          tr.append(td);
        }
        const rate = document.createElement('td');
        rate.append(textNode('span', value(record, '错误率'), 'pill' + (hasErrors(record) ? ' warn' : '')));
        tr.append(rate);
        const more = document.createElement('td');
        const detailButton = textNode('button', '查看详情', 'more');
        detailButton.type = 'button';
        detailButton.addEventListener('click', () => showDetail(record));
        more.append(detailButton);
        tr.append(more);
        fragment.append(tr);
      }
      tbody.replaceChildren(fragment);
      $('recordsTable').hidden = filtered.length === 0;
      $('empty').hidden = filtered.length > 0;
      if (!filtered.length) $('empty').innerHTML = loadedName
        ? '<strong>没有符合条件的记录</strong>请调整搜索或筛选条件。'
        : '<strong>还未产生记录</strong>选择 CSV 文件后，记录会显示在这里。';
      $('tableWrap').scrollTop = 0;
    }

    function mapPoints() {
      return filtered.map(record => ({ record, position: coordinates(record) })).filter(item => item.position);
    }

    function svgNode(tag, attributes = {}) {
      const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [name, val] of Object.entries(attributes)) node.setAttribute(name, String(val));
      return node;
    }

    function selectMapRecord(record) {
      const side = $('mapSide');
      side.replaceChildren(textNode('h3', '位置详情'));
      for (const [label, item] of [
        ['接收时间', `${value(record, '日期')} ${value(record, '时间')}`],
        ['车次', displayTrain(record)], ['机车编号', value(record, '机车编号')],
        ['线路', value(record, '线路')], ['纬度', value(record, '纬度')], ['经度', value(record, '经度')]
      ]) {
        const block = document.createElement('div');
        block.className = 'item';
        block.append(textNode('span', label, 'label'), textNode('span', item, 'value'));
        side.append(block);
      }
      const button = textNode('button', '查看详情', 'button');
      button.type = 'button';
      button.addEventListener('click', () => showDetail(record));
      side.append(button);
    }

    function renderLocalMap(points) {
      const svg = $('coordinateMap');
      svg.replaceChildren();
      if (!points.length) {
        svg.append(svgNode('text', { x: 500, y: 300, class: 'map-no-data' }));
        svg.firstChild.textContent = '当前筛选结果中没有有效坐标';
        return;
      }
      let west = Math.min(...points.map(item => item.position[0]));
      let east = Math.max(...points.map(item => item.position[0]));
      let south = Math.min(...points.map(item => item.position[1]));
      let north = Math.max(...points.map(item => item.position[1]));
      const lonPadding = Math.max((east - west) * .08, .002);
      const latPadding = Math.max((north - south) * .08, .002);
      west -= lonPadding; east += lonPadding; south -= latPadding; north += latPadding;
      const left = 84, right = 960, top = 30, bottom = 535;
      const x = lon => left + (lon - west) / (east - west) * (right - left);
      const y = lat => bottom - (lat - south) / (north - south) * (bottom - top);
      for (let i = 0; i <= 4; i++) {
        const gx = left + i * (right - left) / 4;
        const gy = top + i * (bottom - top) / 4;
        svg.append(svgNode('line', { x1: gx, y1: top, x2: gx, y2: bottom, class: 'map-grid-line' }));
        svg.append(svgNode('line', { x1: left, y1: gy, x2: right, y2: gy, class: 'map-grid-line' }));
        const longitude = svgNode('text', { x: gx, y: 565, class: 'map-axis', 'text-anchor': 'middle' });
        longitude.textContent = (west + i * (east - west) / 4).toFixed(4) + '°E';
        const latitude = svgNode('text', { x: 70, y: gy + 4, class: 'map-axis', 'text-anchor': 'end' });
        latitude.textContent = (north - i * (north - south) / 4).toFixed(4) + '°N';
        svg.append(longitude, latitude);
      }
      for (const item of points) {
        const circle = svgNode('circle', { cx: x(item.position[0]), cy: y(item.position[1]), r: 5, class: 'map-point' });
        const title = svgNode('title');
        title.textContent = `${value(item.record, '日期')} ${value(item.record, '时间')} · ${displayTrain(item.record)}`;
        circle.append(title);
        circle.addEventListener('click', () => {
          svg.querySelectorAll('.map-point.selected').forEach(node => node.classList.remove('selected'));
          circle.classList.add('selected');
          selectMapRecord(item.record);
        });
        svg.append(circle);
      }
    }

    function geoJSON(points) {
      return { type: 'FeatureCollection', features: points.map(item => ({
        type: 'Feature', geometry: { type: 'Point', coordinates: item.position },
        properties: { recordIndex: item.record.index }
      })) };
    }

    function updateOnlineMap(points) {
      if (!onlineMapReady) return;
      onlineMap.getSource('records').setData(geoJSON(points));
      if (points.length) {
        const bounds = new maplibregl.LngLatBounds();
        for (const item of points) bounds.extend(item.position);
        onlineMap.fitBounds(bounds, { padding: 55, maxZoom: 14, duration: 0 });
      }
    }

    function renderMap() {
      const points = mapPoints();
      $('mapSummary').textContent = `当前筛选 ${filtered.length} 条记录，其中 ${points.length} 条有有效坐标，${filtered.length - points.length} 条未绘制。`;
      $('mapSide').replaceChildren(textNode('h3', '位置详情'), textNode('p', '点击图上的点查看对应记录。'));
      renderLocalMap(points);
      updateOnlineMap(points);
    }

    function loadMapLibrary() {
      if (window.maplibregl) return Promise.resolve();
      if (mapLibraryPromise) return mapLibraryPromise;
      mapLibraryPromise = new Promise((resolve, reject) => {
        const stylesheet = document.createElement('link');
        stylesheet.rel = 'stylesheet';
        stylesheet.href = 'https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css';
        document.head.append(stylesheet);
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js';
        script.onload = () => window.maplibregl ? resolve() : reject(new Error('地图库未能启动'));
        script.onerror = () => reject(new Error('地图库加载失败'));
        document.head.append(script);
        setTimeout(() => reject(new Error('地图库加载超时')), 15000);
      }).catch(error => { mapLibraryPromise = null; throw error; });
      return mapLibraryPromise;
    }

    async function showOnlineMap() {
      mapMode = 'online';
      $('mapNote').textContent = '在线底图由 OpenFreeMap 提供，只绘制当前筛选结果中格式完整的坐标，点位仅供参考。';
      $('onlineMapButton').classList.add('active');
      $('localMapButton').classList.remove('active');
      $('coordinateMap').style.display = 'none';
      $('onlineMap').hidden = false;
      if (onlineMap) { onlineMap.resize(); updateOnlineMap(mapPoints()); return; }
      $('onlineMap').replaceChildren(textNode('p', '正在加载在线底图…', 'online-map-status'));
      try {
        await loadMapLibrary();
        if (mapMode !== 'online' || currentView !== 'map') return;
        $('onlineMap').replaceChildren();
        onlineMap = new maplibregl.Map({
          container: 'onlineMap',
          style: 'https://tiles.openfreemap.org/styles/liberty',
          center: [116.4, 39.9], zoom: 10
        });
        onlineMap.addControl(new maplibregl.NavigationControl(), 'top-right');
        onlineMap.on('load', () => {
          onlineMap.addSource('records', { type: 'geojson', data: geoJSON([]) });
          onlineMap.addLayer({ id: 'record-points', type: 'circle', source: 'records', paint: {
            'circle-radius': 6, 'circle-color': '#e56837', 'circle-opacity': .82,
            'circle-stroke-width': 1.5, 'circle-stroke-color': '#ffffff'
          } });
          onlineMap.on('click', 'record-points', event => {
            const index = event.features?.[0]?.properties?.recordIndex;
            const record = records[Number(index)];
            if (record) selectMapRecord(record);
          });
          onlineMap.on('mouseenter', 'record-points', () => { onlineMap.getCanvas().style.cursor = 'pointer'; });
          onlineMap.on('mouseleave', 'record-points', () => { onlineMap.getCanvas().style.cursor = ''; });
          onlineMapReady = true;
          updateOnlineMap(mapPoints());
        });
        onlineMap.on('error', () => {
          if (!onlineMapReady && mapMode === 'online') {
            onlineMap.remove();
            onlineMap = null;
            showLocalMap('在线底图加载失败，已切换到本地坐标图。');
          }
        });
      } catch (error) {
        showLocalMap(`${error.message}，已切换到本地坐标图。`);
      }
    }

    function showLocalMap(message = '') {
      mapMode = 'local';
      $('onlineMapButton').classList.remove('active');
      $('localMapButton').classList.add('active');
      $('onlineMap').hidden = true;
      $('coordinateMap').style.display = 'block';
      $('mapNote').textContent = message || '只绘制当前筛选结果中格式完整的坐标，点位仅供参考。';
      renderLocalMap(mapPoints());
    }

    function setMapExpanded(expanded) {
      mapExpanded = expanded;
      $('mapPane').classList.toggle('expanded', expanded);
      $('resultsPanel').classList.toggle('map-expanded', expanded);
      document.body.classList.toggle('map-expanded', expanded);
      $('expandMapButton').textContent = expanded ? '还原地图' : '放大地图';
      $('expandMapButton').setAttribute('aria-pressed', String(expanded));
      requestAnimationFrame(() => { if (onlineMap) onlineMap.resize(); });
    }

    function switchView(view) {
      if (view !== 'map' && mapExpanded) setMapExpanded(false);
      currentView = view;
      $('listViewButton').classList.toggle('active', view === 'list');
      $('mapViewButton').classList.toggle('active', view === 'map');
      $('listViewButton').setAttribute('aria-pressed', view === 'list');
      $('mapViewButton').setAttribute('aria-pressed', view === 'map');
      $('tableWrap').hidden = view === 'map';
      $('mapPane').hidden = view !== 'map';
      $('resultsTitle').textContent = view === 'map' ? '筛选结果地图' : '记录列表';
      $('resultsHint').textContent = view === 'map'
        ? '地图只显示当前筛选结果中有有效坐标的记录。'
        : '点击“查看详情”查看全部字段。';
      if (view === 'map') mapMode === 'online' ? showOnlineMap() : showLocalMap();
    }

    function showDetail(record) {
      $('detailTitle').textContent = `${value(record, '日期')} ${value(record, '时间')} · 第 ${record.index + 1} 条`;
      const body = $('detailBody');
      const grid = document.createElement('div');
      grid.className = 'detail-grid';
      for (const name of headers) {
        if (name === 'HEX' || name === '原始数据') continue;
        const item = document.createElement('div');
        item.className = 'detail-item';
        item.append(textNode('div', name, 'name'), textNode('div', value(record, name), 'value'));
        grid.append(item);
      }
      body.replaceChildren(grid);
      for (const name of ['HEX', '原始数据']) {
        if (!headers.includes(name)) continue;
        const block = document.createElement('section');
        block.className = 'raw-block';
        block.append(textNode('h3', name), textNode('pre', value(record, name)));
        body.append(block);
      }
      $('detailDialog').showModal();
    }

    function csvCell(value) { return /[",\r\n]/.test(value) ? '"' + value.replaceAll('"', '""') + '"' : value; }
    function exportFiltered() {
      if (!filtered.length) return;
      const lines = [headers.map(csvCell).join(',')];
      for (const record of filtered) lines.push(record.values.map(csvCell).join(','));
      const blob = new Blob(['\ufeff', lines.join('\r\n'), '\r\n'], { type: 'text/csv;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = loadedName.replace(/\.csv$/i, '') + '_筛选结果.csv';
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }

    async function loadFile(file) {
      if (!file) return;
      try {
        const text = (await file.text()).replace(/^\ufeff/, '');
        const parsed = parseCSV(text).filter(row => row.values.some(cell => cell !== ''));
        while (parsed.length && parsed[0].values.length === 1 && parsed[0].values[0].startsWith('#')) parsed.shift();
        if (!parsed.length) throw new Error('文件中没有表头。');
        const nextHeaders = parsed.shift().values;
        const missing = requiredHeaders.filter(name => !nextHeaders.includes(name));
        if (missing.length) throw new Error(`找不到必要字段：${missing.join('、')}。`);
        const bad = parsed.find(row => row.values.length !== nextHeaders.length);
        if (bad) throw new Error(`第 ${bad.line} 行有 ${bad.values.length} 列，表头有 ${nextHeaders.length} 列。`);
        headers = nextHeaders;
        records = parsed.map((row, index) => {
          const record = { values: row.values, index };
          record.search = (row.values.join('\u0001') + '\u0001' + displayTrain(record)).toLocaleLowerCase();
          return record;
        });
        filtered = [];
        loadedName = file.name;
        $('fileName').textContent = file.name;
        $('totalCount').textContent = records.length.toLocaleString('zh-CN');
        $('errorCount').textContent = records.filter(hasErrors).length.toLocaleString('zh-CN');
        const dates = records.map(record => value(record, '日期')).filter(Boolean).sort();
        $('dateRange').textContent = dates.length ? (dates[0] === dates.at(-1) ? dates[0] : `${dates[0]} 至 ${dates.at(-1)}`) : '—';
        setOptions($('dateFilter'), dates, '全部日期');
        setOptions($('routeFilter'), records.map(record => value(record, '线路').trim()).filter(validRoute), '全部线路');
        setOptions($('directionFilter'), ['上行', '下行'], '全部方向');
        $('search').value = $('trainFilter').value = $('locoFilter').value = $('minSpeed').value = $('minRssi').value = $('maxError').value = '';
        $('trainOnly').checked = $('coordsOnly').checked = $('noErrorsOnly').checked = false;
        $('sortOrder').value = 'newest';
        refresh();
        setNotice(`已加载 ${records.length.toLocaleString('zh-CN')} 条记录，${headers.length} 个字段。`);
      } catch (error) {
        setNotice(`导入失败：${error.message}`, true);
      }
    }

    $('chooseButton').addEventListener('click', () => $('fileInput').click());
    $('fileInput').addEventListener('change', event => {
      const file = event.target.files[0];
      event.target.value = '';
      loadFile(file);
    });
    $('exportButton').addEventListener('click', exportFiltered);
    $('listViewButton').addEventListener('click', () => switchView('list'));
    $('mapViewButton').addEventListener('click', () => switchView('map'));
    $('expandMapButton').addEventListener('click', () => setMapExpanded(!mapExpanded));
    $('onlineMapButton').addEventListener('click', showOnlineMap);
    $('localMapButton').addEventListener('click', () => showLocalMap());
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && mapExpanded && !$('detailDialog').open) setMapExpanded(false);
    });
    $('closeButton').addEventListener('click', () => $('detailDialog').close());
    $('resetButton').addEventListener('click', () => {
      $('search').value = $('trainFilter').value = $('locoFilter').value = $('minSpeed').value = $('minRssi').value = $('maxError').value = '';
      $('dateFilter').value = $('routeFilter').value = $('directionFilter').value = '';
      $('trainOnly').checked = $('coordsOnly').checked = $('noErrorsOnly').checked = false;
      $('sortOrder').value = 'newest';
      refresh();
    });
    for (const id of ['search', 'trainFilter', 'locoFilter', 'minSpeed', 'minRssi', 'maxError', 'dateFilter', 'routeFilter', 'directionFilter', 'sortOrder', 'trainOnly', 'coordsOnly', 'noErrorsOnly'])
      $(id).addEventListener(['search', 'trainFilter', 'locoFilter', 'minSpeed', 'minRssi', 'maxError'].includes(id) ? 'input' : 'change', refresh);
    const zone = $('dropZone');
    for (const type of ['dragenter', 'dragover']) zone.addEventListener(type, event => { event.preventDefault(); zone.classList.add('dragging'); });
    for (const type of ['dragleave', 'drop']) zone.addEventListener(type, event => { event.preventDefault(); zone.classList.remove('dragging'); });
    zone.addEventListener('drop', event => loadFile(event.dataTransfer.files[0]));
  </script>
</body>
</html>
